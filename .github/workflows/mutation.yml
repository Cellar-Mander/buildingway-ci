name: Mutation

# Would the tests catch plausible faults? Stryker.NET mutates the code under test and reruns the
# tests. Informs only: no score threshold, and keep "<job> / mutation" out of required checks.
# Stryker must be a local tool in the caller's tool manifest (.config/dotnet-tools.json), with its settings
# in the test project's stryker-config.json. Stryker runs one test runner per core unless that file
# sets concurrency. On pull requests only mutants in code or tests changed against
# the base branch are tested; a PR labelled mutation gets a full run instead, e.g. when tests were
# deleted. Other events (e.g. workflow_dispatch) always get a full run. The caller triggers on
# pull_request with types opened, synchronize, reopened and labeled; other labels start no run.
#
# On those changed-code runs Stryker runs every test against each mutant (--disable-bail), so the
# report names every test that kills it, and kill-report joins it with test.yml's revert-check
# verdicts: which of the PR's new and changed tests kill mutants on its changed lines. kill-report
# reads the revert-check artifact from the caller's Tests run for the same commit, waiting only while
# a revert-check job for that commit is still going, so the caller must grant actions: read, and its
# Buildingway.Tools must be 0.2.0 or later. It never starts a mutation run of its own, and passes when either report is missing.
# --disable-bail costs about a fifth more Stryker time, so a changed-code run keeps bailing when
# kill-report is sure to have nothing to join: the PR changes no test files or only test files (as
# revert-check splits them), or the caller sets kill-report: false, which it should whenever
# test.yml's revert-check is off.
# Buildingway.Tools can't list itself in its own tool manifest, so it sets buildingway-project and
# kill-report runs the tool the PR builds.
on:
  workflow_call:
    inputs:
      test-project:
        description: Test project folder holding stryker-config.json, e.g. MyPlugin.Core.Tests
        required: true
        type: string
      buildingway-project:
        description: >-
          Project kill-report runs with dotnet run as buildingway instead of the caller's tool manifest's
          (Buildingway.Tools itself sets Buildingway.Tools)
        required: false
        type: string
        default: ''
      kill-report:
        description: >-
          Whether to join pull request runs with test.yml's revert-check verdicts; set false when
          revert-check is off, so Stryker keeps stopping each mutant at its first killing test
        required: false
        type: boolean
        default: true
      dotnet-version:
        description: .NET SDK version for actions/setup-dotnet
        required: false
        type: string
        default: 10.0.x

permissions:
  contents: read

jobs:

  mutation:
    name: mutation
    if: github.event.action != 'labeled' || github.event.label.name == 'mutation'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read  # Buildingway.Tools and Buildingway.Build from GitHub Packages
    outputs:
      # Whether the report names every killing test, as kill-report needs, and if not, why not
      all-killers: ${{ steps.plan.outputs.all-killers }}
      no-kill-report: ${{ steps.plan.outputs.no-kill-report }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # --since diffs against the base branch
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Restore tools
      # The caller's nuget.config names the GitHub Packages feed "buildingway"; its package
      # must grant the caller's repo read access under Manage Actions access
      env:
        NuGetPackageSourceCredentials_buildingway: Username=token;Password=${{ github.token }}
      run: dotnet tool restore

    # Without --disable-bail Stryker stops each mutant's run at its first failing test and names only
    # that one. Only a changed-code run that kill-report can use pays for naming them all. A file is
    # a test when it matches a revert_tests= glob in .claude/checks, or, with none set, revert-check's
    # TEST_PATH pattern; .claude/ and .github/ are never product. Deleted tests have nothing to prove.
    # Keep this in step with Buildingway.Tools/Scripts/revert-check.
    - name: Plan kill report
      id: plan
      env:
        SINCE: >-
          ${{ github.event_name == 'pull_request'
          && !contains(github.event.pull_request.labels.*.name, 'mutation')
          && format('origin/{0}', github.base_ref) || '' }}
        KILL_REPORT: ${{ inputs.kill-report }}
      run: |
        set -f  # revert_tests globs are patterns, not paths to expand
        why=
        if [ -z "$SINCE" ]; then
          why="this was a full mutation run, which names only the first killing test of each mutant."
        elif [ "$KILL_REPORT" != true ]; then
          why="the caller set kill-report: false (revert-check is off), so Stryker kept its bail."
        else
          globs=$(git show HEAD:.claude/checks 2>/dev/null |
            sed -n 's/^[[:space:]]*revert_tests[[:space:]]*=//p' | head -n 1)
          test_path='(^|/)(tests?|__tests__)/|(^|/)test_[^/]*$|_test\.[^/]*$|\.(test|spec)\.[^/]*$|Tests?\.[^/]*$|Tests?/'
          tests=0 product=0
          while IFS=$'\t' read -r status path; do
            is_test=false
            if [ -n "$globs" ]; then
              for g in $globs; do
                # shellcheck disable=SC2254  # $g is a glob, as revert-check's fnmatch
                case $path in $g) is_test=true; break ;; esac
              done
            elif [[ $path =~ $test_path ]]; then
              is_test=true
            fi
            if $is_test; then
              [ "$status" = D ] || tests=$((tests + 1))
            elif [[ $path != .claude/* && $path != .github/* ]]; then
              product=$((product + 1))
            fi
          done < <(git diff --name-status --no-renames "$SINCE...HEAD")
          if [ "$tests" = 0 ]; then
            why="the PR adds or changes no test files, so revert-check has nothing to prove and Stryker kept its bail."
          elif [ "$product" = 0 ]; then
            why="the PR changes only tests, so revert-check has no product change to revert and Stryker kept its bail."
          fi
        fi
        if [ -n "$why" ]; then all_killers=false; else all_killers=true; fi
        echo "all-killers=$all_killers" >> "$GITHUB_OUTPUT"
        echo "no-kill-report=$why" >> "$GITHUB_OUTPUT"
        echo "${why:-Stryker names every killing test for kill-report.}"

    - name: Mutation test
      working-directory: ${{ inputs.test-project }}
      env:
        SINCE: >-
          ${{ github.event_name == 'pull_request'
          && !contains(github.event.pull_request.labels.*.name, 'mutation')
          && format('--since:origin/{0}', github.base_ref) || '' }}
        ALL_KILLERS: ${{ steps.plan.outputs.all-killers }}
        NuGetPackageSourceCredentials_buildingway: Username=token;Password=${{ github.token }}
      # One test runner per core (Stryker's default is half the cores): the runner is disposable,
      # and per-mutant overhead, not the tests, dominates. A concurrency in stryker-config.json wins.
      run: |
        bail=()
        [ "$ALL_KILLERS" = true ] && bail=(--disable-bail)
        concurrency=()
        if ! jq -e '."stryker-config".concurrency // empty' stryker-config.json > /dev/null 2>&1; then
          concurrency=(--concurrency "$(nproc)")
        fi
        dotnet stryker ${SINCE:+"$SINCE"} "${bail[@]}" "${concurrency[@]}" --output "$RUNNER_TEMP/stryker"

    - name: Summary
      if: always()
      run: cat "$RUNNER_TEMP/stryker/reports/mutation-report.md" >> "$GITHUB_STEP_SUMMARY" || true

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mutation-report
        path: ${{ runner.temp }}/stryker/reports/
        if-no-files-found: ignore

  kill-report:
    name: kill-report
    needs: mutation
    if: always() && github.event_name == 'pull_request' && needs.mutation.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read  # Buildingway.Tools from GitHub Packages
      actions: read   # finds and downloads the Tests run's revert-check artifact

    steps:
    # Says why, and skips the rest, when the mutation job planned no report
    - name: No kill report
      if: needs.mutation.outputs.all-killers != 'true'
      env:
        WHY: ${{ needs.mutation.outputs.no-kill-report || 'the mutation job stopped before planning one.' }}
      run: |
        echo "No kill report: $WHY"
        { echo '## Kill report'; echo; echo "No kill report: $WHY"; } >> "$GITHUB_STEP_SUMMARY"

    - name: Checkout
      if: needs.mutation.outputs.all-killers == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # mutant-triage diffs the changed lines against revert-check's merge base
        fetch-depth: 0

    - name: Install .NET
      if: needs.mutation.outputs.all-killers == 'true'
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Restore tools
      if: needs.mutation.outputs.all-killers == 'true'
      env:
        NuGetPackageSourceCredentials_buildingway: Username=token;Password=${{ github.token }}
      run: dotnet tool restore

    - name: Download mutation report
      if: needs.mutation.outputs.all-killers == 'true'
      continue-on-error: true  # a failed or cancelled run may have uploaded nothing
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: mutation-report
        path: reports/mutation

    # The newest revert-check artifact from a run for the PR's head commit. Until one exists, wait
    # while a revert-check job for that commit is unfinished, or a run for it lists no jobs yet (it
    # may hold one); other jobs and workflows don't hold it up. Checking jobs before looking for the
    # artifact means a job that uploaded and finished in between can't be missed. revert-check
    # writes no verdicts when it stops early with nothing to prove, so a passed revert-check job
    # with no artifact means that, not a missing report.
    - name: Download revert-check verdicts
      if: needs.mutation.outputs.all-killers == 'true'
      id: verdicts
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
      run: |
        rc_jobs='.jobs[] | select(.name | test("(^| / )revert-check$"))'
        deadline=$((SECONDS + 20 * 60))
        while :; do
          busy=0
          for id in $(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&per_page=100" \
              --jq ".workflow_runs[] | select(.id != $RUN_ID and .status != \"completed\") | .id"); do
            n=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" \
              --jq "if .total_count == 0 then 1 else [$rc_jobs | select(.status != \"completed\")] | length end")
            busy=$((busy + n))
          done
          run=$(gh api "repos/$REPO/actions/artifacts?name=revert-check&per_page=100" \
            --jq "[.artifacts[] | select(.workflow_run.head_sha == \"$HEAD_SHA\" and (.expired | not))]
                  | max_by(.created_at) | .workflow_run.id // empty")
          if [ -n "$run" ]; then
            gh run download "$run" --repo "$REPO" --name revert-check --dir reports/revert-check
            echo "revert-check verdicts from run $run"
            break
          fi
          if [ "$busy" = 0 ]; then
            passed=$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&status=completed&per_page=100" --jq '.workflow_runs[].id' |
              while read -r id; do
                gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" --jq "$rc_jobs | select(.conclusion == \"success\") | .id"
              done)
            if [ -n "$passed" ]; then
              echo "nothing=true" >> "$GITHUB_OUTPUT"
              echo "revert-check passed for $HEAD_SHA without verdicts: nothing to prove."
            else
              echo "No run for $HEAD_SHA uploaded revert-check verdicts."
            fi
            break
          fi
          if [ "$SECONDS" -ge "$deadline" ]; then
            echo "Gave up after 20 minutes: $busy revert-check job(s) for $HEAD_SHA still going, none with verdicts yet."
            break
          fi
          sleep 30
        done

    # bash -eo pipefail: a mutant-triage that can't run fails the job instead of writing an empty report
    - name: Kill report
      if: needs.mutation.outputs.all-killers == 'true'
      shell: bash
      env:
        NOTHING_TO_PROVE: ${{ steps.verdicts.outputs.nothing }}
        BUILDINGWAY_PROJECT: ${{ inputs.buildingway-project }}
        NuGetPackageSourceCredentials_buildingway: Username=token;Password=${{ github.token }}
      run: |
        rc=reports/revert-check/revert-check.json
        report=reports/mutation/mutation-report.json
        if [ ! -f "$report" ]; then
          msg="No kill report: no mutation report (the run failed, or stryker-config.json lacks the json reporter)."
        elif [ ! -f "$rc" ] && [ "$NOTHING_TO_PROVE" = true ]; then
          msg="No kill report: revert-check found nothing to prove (no changed test functions, no product changes, or the tests fail at HEAD; see its log)."
        elif [ ! -f "$rc" ]; then
          msg="No kill report: no revert-check verdicts for this commit (revert-check off, or its run failed before writing them)."
        fi
        if [ -n "${msg-}" ]; then
          echo "$msg"
          { echo '## Kill report'; echo; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        buildingway=(dotnet buildingway)
        if [ -n "$BUILDINGWAY_PROJECT" ]; then
          dotnet build "$BUILDINGWAY_PROJECT" -c Release --nologo -v q
          buildingway=(dotnet run --project "$BUILDINGWAY_PROJECT" -c Release --no-build --)
        fi
        "${buildingway[@]}" mutant-triage tests --revert "$rc" "$report" | tee kill-report.txt
        { echo '## Kill report'; echo; echo '```'; cat kill-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
