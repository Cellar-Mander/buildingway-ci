name: Tests

# Runs a project's game-independent tests; the plugin project itself needs a Dalamud install to
# build, so the test project must not reference it. On pull requests, revert-check also runs
# `dotnet buildingway revert-check` from the caller's tool manifest (Buildingway.Tools in
# .config/dotnet-tools.json): do the PR's new or changed tests fail with its product changes
# reverted? It informs only, so keep "<job> / revert-check" out of required checks. Its verdicts go
# to a revert-check artifact (revert-check.json), which mutation.yml's kill-report joins with the
# mutation run; that needs Buildingway.Tools 0.2.0 or later (revert-check --json).
on:
  workflow_call:
    inputs:
      test-project:
        description: Test project (or its folder) to build and test, e.g. MyPlugin.Core.Tests
        required: true
        type: string
      revert-check:
        description: Run dotnet buildingway revert-check on pull requests
        required: false
        type: boolean
        default: true
      dotnet-version:
        description: .NET SDK version for actions/setup-dotnet
        required: false
        type: string
        default: 10.0.x

permissions:
  contents: read

jobs:

  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read  # Buildingway.Build and other Buildingway.* packages from GitHub Packages

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    # Restoring a project that uses the Buildingway.Build SDK reads the caller's "buildingway" feed
    - name: Test
      env:
        TEST_PROJECT: ${{ inputs.test-project }}
        NuGetPackageSourceCredentials_buildingway: Username=token;Password=${{ github.token }}
      run: dotnet test "$TEST_PROJECT" --configuration Release

  revert-check:
    name: revert-check
    if: github.event_name == 'pull_request' && inputs.revert-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read  # Buildingway.Tools and Buildingway.Build from GitHub Packages

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Restore tools
      # The caller's nuget.config names the GitHub Packages feed "buildingway"; its package
      # must grant the caller's repo read access under Manage Actions access
      env:
        NuGetPackageSourceCredentials_buildingway: Username=token;Password=${{ github.token }}
      run: dotnet tool restore

    - name: Revert check
      env:
        TEST_PROJECT: ${{ inputs.test-project }}
        NuGetPackageSourceCredentials_buildingway: Username=token;Password=${{ github.token }}
      run: >-
        dotnet buildingway revert-check --ci --json "$RUNNER_TEMP/revert-check.json" --test-cmd
        "dotnet build '$TEST_PROJECT' --nologo -v q && dotnet test '$TEST_PROJECT' --nologo --no-build --logger \"trx;LogFileName={trx}\""

    # Also when revert-check exits 1 (a test that doesn't guard the change): its verdicts are still valid
    - name: Upload verdicts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: revert-check
        path: ${{ runner.temp }}/revert-check.json
        if-no-files-found: ignore
