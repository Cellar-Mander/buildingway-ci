name: Tests

# Runs a project's game-independent tests; the plugin project itself needs a Dalamud install to
# build, so the test project must not reference it. On pull requests, revert-check also runs
# `dotnet buildingway revert-check` from the caller's tool manifest (Buildingway.Tools in
# .config/dotnet-tools.json): do the PR's new or changed tests fail with its product changes
# reverted? It informs only, so keep "<job> / revert-check" out of required checks.
on:
  workflow_call:
    inputs:
      test-project:
        description: Test project (or its folder) to build and test, e.g. MyPlugin.Core.Tests
        required: true
        type: string
      revert-check:
        description: Run dotnet buildingway revert-check on pull requests
        required: false
        type: boolean
        default: true
      dotnet-version:
        description: .NET SDK version for actions/setup-dotnet
        required: false
        type: string
        default: 10.0.x

permissions:
  contents: read

jobs:

  test:
    name: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Test
      env:
        TEST_PROJECT: ${{ inputs.test-project }}
      run: dotnet test "$TEST_PROJECT" --configuration Release

  revert-check:
    name: revert-check
    if: github.event_name == 'pull_request' && inputs.revert-check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Restore tools
      run: dotnet tool restore

    - name: Revert check
      env:
        TEST_PROJECT: ${{ inputs.test-project }}
      run: >-
        dotnet buildingway revert-check --ci --test-cmd
        "dotnet build '$TEST_PROJECT' --nologo -v q && dotnet test '$TEST_PROJECT' --nologo --no-build --logger \"trx;LogFileName={trx}\""
